# Performance Benchmark Results
# Generated from k6 load tests and policy benchmarks

pipeline_latency:
  deterministic_stage:
    description: "Regex patterns + keyword matching + schema validation"
    targets:
      p50: 20ms
      p95: 50ms
      p99: 100ms
    achieved:
      p50: 12ms
      p95: 34ms
      p99: 67ms
    patterns_compiled: 33
    compilation_mode: "NonBacktracking"

  opa_evaluation:
    description: "6 Rego policy packages evaluated via OPA"
    targets:
      p50: 30ms
      p95: 80ms
    achieved:
      p50: 18ms
      p95: 42ms
    packages:
      - { name: "pii/gdpr", avg_ms: 3.2 }
      - { name: "pii/hipaa", avg_ms: 2.8 }
      - { name: "pii/soc2", avg_ms: 2.1 }
      - { name: "security/injection", avg_ms: 4.5 }
      - { name: "safety/content", avg_ms: 1.9 }
      - { name: "brand/tone", avg_ms: 1.5 }

  llm_judge:
    description: "Ollama Mistral semantic analysis (async)"
    targets:
      p50: 3000ms
      p95: 5000ms
    achieved:
      p50: 1800ms
      p95: 3200ms
    invocation_rate: "20% of requests"
    model: "mistral"
    temperature: 0.1

  full_pipeline:
    description: "End-to-end (deterministic + OPA, without LLM)"
    targets:
      p50: 50ms
      p95: 100ms
    achieved:
      p50: 32ms
      p95: 78ms

