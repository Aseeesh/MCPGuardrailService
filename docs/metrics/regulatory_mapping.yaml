# Regulatory Control Mapping — MCPGuardrailService
# Maps each implemented policy/feature to specific regulatory controls

gdpr:
  - control: "ART 5 — Principles of Processing"
    sub_controls:
      - id: "ART5-1a"
        name: "Lawfulness, fairness, transparency"
        status: covered
        implemented_by:
          - "gdpr_pii.rego: purpose validation against approved list"
          - "Audit trail: all processing logged with transparency"
        evidence: "OPA policy validates lawful basis before processing"

      - id: "ART5-1b"
        name: "Purpose limitation"
        status: covered
        implemented_by:
          - "gdpr_pii.rego: purpose_limitation rule"
        evidence: "Processing blocked when purpose not in approved set"

      - id: "ART5-1c"
        name: "Data minimization"
        status: covered
        implemented_by:
          - "RedactionEngine.cs: selective PII redaction"
          - "gdpr_pii.rego: multiple PII fields detection"
        evidence: "Auto-redaction removes unnecessary PII from outputs"

      - id: "ART5-1e"
        name: "Storage limitation"
        status: covered
        implemented_by:
          - "gdpr_pii.rego: retention period validation"
          - "Azure Storage lifecycle: cool→archive→delete"
        evidence: "Configurable per-category retention with enforcement"

  - control: "ART 6 — Lawful Basis"
    status: covered
    implemented_by:
      - "gdpr_pii.rego: valid_purpose() function"
      - "GdprControls.cs: consent management"
    evidence: "6 lawful bases supported: consent, contract, legal_obligation, vital_interest, public_interest, legitimate_interest"

  - control: "ART 9 — Special Categories"
    status: covered
    implemented_by:
      - "gdpr_pii.rego: 10 special category keywords"
    evidence: "Blocks processing of racial, ethnic, political, religious, genetic, biometric, health, sex life data without explicit consent"

  - control: "ART 17 — Right to Erasure"
    status: partial
    implemented_by:
      - "GdprControls.cs: erasure request queue"
      - "RedactionEngine.cs: PII removal"
    gap: "Automated cross-system erasure propagation"

  - control: "ART 25 — Data Protection by Design"
    status: covered
    implemented_by:
      - "Multi-stage detection pipeline"
      - "PII auto-redaction by default"
      - "Encryption enforcement policies"

  - control: "ART 33 — Breach Notification"
    status: partial
    implemented_by:
      - "GdprControls.cs: breach notification tracking"
      - "Real-time violation detection"
    gap: "Automated DPA notification within 72h"

  - control: "ART 46 — Cross-Border Transfer"
    status: covered
    implemented_by:
      - "gdpr_pii.rego: cross_border_transfer rule"
    evidence: "Blocks transfers without adequacy decision or SCCs"

hipaa:
  - control: "§164.308 — Administrative Safeguards"
    sub_controls:
      - id: "164.308(a)(1)"
        name: "Risk Analysis"
        status: covered
        implemented_by:
          - "EvidenceCollector.cs: automated risk assessment"
          - "Compliance dashboard: real-time risk view"

      - id: "164.308(a)(5)"
        name: "Security Awareness Training"
        status: not_implemented
        gap: "Requires organizational integration"

  - control: "§164.312 — Technical Safeguards"
    sub_controls:
      - id: "164.312(a)"
        name: "Access Control"
        status: covered
        implemented_by:
          - "JwtAuthMiddleware.cs: authentication"
          - "RbacMiddleware: role-based authorization"
          - "RateLimitingMiddleware.cs: abuse prevention"

      - id: "164.312(b)"
        name: "Audit Controls"
        status: covered
        implemented_by:
          - "AuditService.cs: immutable hash-chain audit trail"
          - "RequestLoggingMiddleware: structured logging"
          - "PostgreSQL: all access logged with DB triggers"

      - id: "164.312(e)"
        name: "Transmission Security"
        status: covered
        implemented_by:
          - "HTTPS-only enforcement"
          - "TLS 1.2 minimum across all services"
          - "SecurityHeadersMiddleware.cs: HSTS"

  - control: "§164.502 — Uses and Disclosures"
    status: covered
    implemented_by:
      - "hipaa_phi.rego: PHI keyword detection"
      - "hipaa_phi.rego: minimum necessary standard"
      - "hipaa_phi.rego: authorization checks"

  - control: "§164.514 — De-identification"
    status: covered
    implemented_by:
      - "hipaa_phi.rego: SSN and MRN pattern detection"
      - "RedactionEngine.cs: automatic de-identification"
      - "DeterministicStage.cs: Safe Harbor identifiers"

soc2:
  - control: "CC6.1 — Logical Access Security"
    status: covered
    implemented_by:
      - "JwtAuthMiddleware.cs + RbacMiddleware"
      - "soc2_data.rego: credential exposure detection"
      - "injection.rego: SQL/XSS/command injection prevention"
      - "DeterministicStage.cs: AWS key, JWT, private key detection"

  - control: "CC6.7 — Data Transmission & Storage"
    status: covered
    implemented_by:
      - "TLS 1.2 enforcement across all services"
      - "soc2_data.rego: backup encryption checks"
      - "Azure Storage: server-side encryption at rest"
      - "Redis: TLS-only connections"

  - control: "CC7.2 — Monitoring Activities"
    status: covered
    implemented_by:
      - "PerformanceMetrics.cs: P50/P95/P99 tracking"
      - "Grafana dashboard: 10-panel monitoring"
      - "Prometheus: metrics scraping"
      - "soc2_data.rego: disabled logging detection"
      - "Azure Monitor: metric alerts"

  - control: "CC8.1 — Change Management"
    status: covered
    implemented_by:
      - "policy-deploy.yml: 6-stage GitOps pipeline"
      - "Canary deployment with 5-min monitoring"
      - "Automated rollback on threshold breach"
      - "Git tags for policy version tracking"

  - control: "PI1.1 — Processing Integrity"
    status: covered
    implemented_by:
      - "AuditService.cs: SHA-256 hash chain"
      - "001_audit_schema.sql: immutability triggers"
      - "verify_hash_chain() function"
      - "DeterministicStage.cs: JSON schema validation"

