global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "guardrail-api"
    metrics_path: "/api/metrics/prometheus"
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: "api-gateway"

  - job_name: "opa"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["opa:8181"]
        labels:
          service: "opa"

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: "rabbitmq"
